<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оплата успешна — LuarSMP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --accent:#4a9eff;--accent-2:#7c5cff;--accent-3:#00d4ff;
  --bg-1:#050914;--bg-2:#0a1428;--bg-3:#0d1e3d;
  --surface:rgba(255,255,255,0.04);--border:rgba(120,170,255,0.12);
  --text:#eef4ff;--text-2:#8fa5c4;
}
[data-theme="light"]{
  --bg-1:#eaf1fb;--bg-2:#d8e5f8;--bg-3:#c8dbf4;
  --surface:rgba(255,255,255,0.7);--border:rgba(70,120,200,0.18);
  --text:#0a1a33;--text-2:#4a6180;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter','Segoe UI',sans-serif;
  background:linear-gradient(135deg,var(--bg-1),var(--bg-2),var(--bg-3));
  background-attachment:fixed;color:var(--text);min-height:100vh;
  display:grid;place-items:center;padding:20px;position:relative;overflow:hidden;
}
.glow{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;opacity:.5}
.g1{width:500px;height:500px;background:#4ade80;top:-150px;left:-100px}
.g2{width:400px;height:400px;background:var(--accent);bottom:-150px;right:-100px}
.card{
  position:relative;z-index:1;
  max-width:520px;width:100%;
  background:var(--surface);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);border-radius:28px;
  padding:48px 40px;text-align:center;
  box-shadow:0 40px 100px rgba(0,0,0,0.4);
  animation:pop .6s cubic-bezier(0.22,1,0.36,1);
}
@keyframes pop{from{opacity:0;transform:scale(0.9) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
.icon-wrap{
  width:110px;height:110px;margin:0 auto 28px;
  border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(74,222,128,0.15),rgba(74,158,255,0.1));
  border:2px solid rgba(74,222,128,0.4);
  box-shadow:0 0 60px rgba(74,222,128,0.4);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 60px rgba(74,222,128,0.4)}50%{box-shadow:0 0 90px rgba(74,222,128,0.7)}}
.icon-wrap i{font-size:3.5rem;color:#4ade80}
h1{font-size:2rem;font-weight:800;margin-bottom:12px;
  background:linear-gradient(135deg,#4ade80,var(--accent-3));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p{color:var(--text-2);font-size:1.02rem;line-height:1.6;margin-bottom:28px}
.info-box{
  background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.25);
  border-radius:16px;padding:18px 20px;margin-bottom:28px;text-align:left;
}
.info-box .row{display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem}
.info-box .row span:first-child{color:var(--text-2)}
.info-box .row span:last-child{font-weight:600;color:#4ade80}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{
  padding:14px 28px;border-radius:14px;font-weight:700;font-size:.95rem;
  text-decoration:none;cursor:pointer;border:none;
  display:inline-flex;align-items:center;gap:10px;
  transition:all 0.4s cubic-bezier(0.22,1,0.36,1);
}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 10px 30px rgba(74,158,255,0.35)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(74,158,255,0.55)}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);transform:translateY(-3px)}
.brand{position:fixed;top:24px;left:32px;display:flex;align-items:center;gap:10px;
  font-size:1.1rem;font-weight:800;z-index:10}
.brand .logo{width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;font-size:.95rem;color:#fff}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="brand">
  <div class="logo"><i class="fas fa-cube"></i></div>
  <span>LuarSMP</span>
</div>

<div class="card">
  <div class="icon-wrap"><i class="fas fa-check"></i></div>
  <h1>Оплата прошла успешно!</h1>
  <p>Спасибо за покупку. Привилегия или предмет будет выдан в течение 1–2 минут. Зайди на сервер <strong>play.luarsmp.ru</strong>, чтобы проверить.</p>

  <div class="info-box">
    <div class="row"><span>Статус</span><span>✓ Оплачено</span></div>
    <div class="row"><span>Выдача</span><span>1–2 минуты</span></div>
    <div class="row"><span>Поддержка</span><span>stepan.3mail@mail.ru</span></div>
  </div>

  <div class="actions">
    <a href="/" class="btn btn-primary"><i class="fas fa-store"></i> В магазин</a>
    <a href="https://archive.luarsmp.ru/LuarLauncher-v0.1.exe" class="btn btn-ghost"><i class="fas fa-download"></i> Лаунчер</a>
  </div>
</div>

<script>
const theme = localStorage.getItem('luar_theme') || 'dark';
document.documentElement.setAttribute('data-theme', theme);
</script>
</body>
</html>
