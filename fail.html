<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата не прошла</title>
    <style>
        body {
            background: #0a0e17;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #e6edf3;
            margin: 0;
            text-align: center;
        }
        .fail-box {
            animation: popIn 0.8s ease forwards;
            opacity: 0;
            transform: scale(0.8);
        }
        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }
        .cross {
            width: 80px;
            height: 80px;
            background: #da3633;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: #fff;
            margin-bottom: 20px;
        }
        h1 { font-size: 2.2rem; margin-bottom: 8px; }
        p { color: #8b949e; font-size: 1.1rem; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="fail-box">
        <div class="cross">✕</div>
        <h1>Оплата не прошла</h1>
        <p>Попробуйте позже или свяжитесь с поддержкой.</p>
        <p><a href="https://luarsmp.ru">Вернуться на главную</a></p>
    </div>
</body>
</html>
